/* ---------- زر الرفع: نافذة التأكيد ثم العملية ---------- */
function gUpAsk(crn) {
  const sec = A.raw.gsec[crn];
  if (!sec) return;
  if (!gMay(crn)) { toast(gNotMine(crn)); gLog([['blocked', crn, '', '', '', '', 'محاولة رفع شعبة غير مسندة']]); return; }
  const st = gSt(sec), s = st.stats, bl = G.blockers(sec, gMarks(crn), gNow(), gSet(), {}), f = sec.flow || {};
  const dup = f.sync && f.sync.st === 'ok' && f.sync.sig === st.sig, cur = gCurOp(sec), running = cur && cur.st === 'prepared';
  const errs = s.err + s.issues.filter((x) => !x.warn).length;
  A.gEdit = crn;
  modal(`<h2>رفع درجات الشعبة إلى رايات</h2><table class="kv"><tbody><tr><th>المقرر</th><td>${esc(sec.name)} (${esc(sec.code)})</td></tr><tr><th>الشعبة</th><td><b>${crn}</b></td></tr><tr><th>القابلون للرصد</th><td>${s.elig}</td></tr><tr><th>الدرجات المكتملة</th><td>${s.have} من ${s.need}</td></tr><tr><th>عدد الأخطاء</th><td class="${errs ? 'gred' : ''}">${errs}</td></tr><tr><th>توزيع الدرجات</th><td>${G.comps(sec).map((c) => `${esc(c.k)}: ${G.fmt(c.max)}`).join(' • ')}</td></tr><tr><th>النسخة المجمدة</th><td>${f.lock && f.lock.on ? `<span dir="ltr">${esc(f.lock.snap)}</span> • البصمة <span dir="ltr">${esc(f.lock.sig)}</span>` : '—'}</td></tr><tr><th>حالة الجاهزية</th><td>${dup ? '<span class="chip ok">مرفوعة ومطابقة</span>' : bl.length ? '<span class="chip bad">غير جاهز</span>' : '<span class="chip ok">جاهز للرفع</span>'}</td></tr></tbody></table>
  ${dup ? `<div class="gnote ok">هذه الدرجات نفسها رُفعت وتحققت مطابقتها في العملية ${esc(f.sync.opId)}. لا يُعاد إرسالها.</div>` : bl.length ? `<div class="gnote bad"><b>لا يمكن بدء الرفع:</b><ul>${bl.map((b) => `<li>${esc(b)}</li>`).join('')}</ul></div>` : `<div class="gnote info">${running ? `العملية ${esc(cur.id)} ما زالت مفتوحة، وستُنسخ حزمتها نفسها دون عملية جديدة.` : 'عند التأكيد تُنشأ عملية بمعرف فريد وتُنسخ حزمة هذه الشعبة وحدها.'} يكتب الجسر في رايات ما اختلف فقط، ثم يعيد القراءة للتحقق. لا تُعد الدرجات مرفوعة حتى تلصق نتيجة الجسر هنا وتنجح المطابقة.</div>`}

}

/* ---------- المزامنة مع منصة رايات (Rayat Integration Engine) ---------- */
const gReconTable = (res) => { const bad = (res.rows || []).filter((r) => r.st !== 'ok'); return bad.length ? `<div class="tw"><table><thead><tr><th>المتدرب</th><th class="n">الرقم التدريبي</th><th class="n">في حاضر</th><th class="n">في رايات</th><th class="n">الحالة</th><th>السبب</th></tr></thead><tbody>${bad.map((r) => `<tr><td>${esc(r.name)}</td><td class="n" dir="ltr">${esc(r.id)}</td><td class="n">${r.total == null ? '—' : G.fmt(r.total)}</td><td class="n">${r.rTotal == null ? '—' : G.fmt(r.rTotal)}</td><td class="n"><span class="chip ${r.st === 'manual' || r.st === 'unverified' ? 'warn' : 'bad'}">${G.RC[r.st]}</span></td><td style="font-size:12.5px">${esc((r.why || []).join('؛ '))}</td></tr>`).join('')}</tbody></table></div>` : ''; };
const gReconSum = (res) => `<div class="grev">${Object.keys(G.RC).map((k) => `<span>${G.RC[k]} <b class="${k !== 'ok' && res.sum[k] ? 'gred' : ''}">${res.sum[k] || 0}</b></span>`).join('')}</div>`;
function gRosterDiff(sec, op) {
  const all = op && op.res && op.res.all; if (!all || !all.length) return [];

  all.forEach((x) => { const r = by[x.id], el = x.gr === 'Y' || x.gr === true; if (!r) out.push({ t: 'add', id: x.id, name: x.n, st: x.st, el, text: `في رايات وغير موجود في حاضر: ${x.n} (${x.id}) — ${x.st || ''}` }); else if (!!r.el !== el) out.push({ t: 'el', id: x.id, name: r.name, st: x.st, el, text: `${r.name}: ${el ? 'قابل للرصد في رايات وغير قابل في حاضر' : 'غير قابل للرصد في رايات وقابل في حاضر'} (${x.st || ''})` }); delete by[x.id]; });

    <ol class="gsteps"><li class="done"><b>الحزمة جاهزة</b><span>نُسخت إلى الحافظة.</span>${mine ? `<button class="btn s" data-act="g-pkg" data-crn="${crn}">نسخ الحزمة مرة أخرى</button>` : ''}</li><li class="cur"><b>شغّل الجسر في رايات</b><span>افتح صفحة إدخال الدرجات، واضغط إشارة «جسر حاضر»، والصق الحزمة، وراجع الفروقات، ثم اضغط التطبيق.</span><a class="btn s" href="${RAYAT_GRADES}" target="_blank" rel="noopener">فتح رايات</a></li><li><b>الصق النتيجة هنا</b>${mine ? `<textarea id="gRes" rows="2" dir="ltr" data-change="g-res" placeholder="نتيجة الجسر" aria-label="نتيجة الجسر"></textarea>` : ''}<span>تُطابق المنصة ما قُرئ من رايات مع النسخة المجمدة.</span></li></ol>

    : `<section class="panel"><div class="row gtools"><input type="search" id="gLogQ" placeholder="بحث في السجل" aria-label="بحث في السجل" value="${esc(GX.logQ || '')}"><label>الشعبة <select data-change="g-logf" data-k="crn"><option value="">الكل</option>${gSecs().map((s) => `<option value="${s.crn}" ${F.crn === s.crn ? 'selected' : ''}>${s.crn}</option>`).join('')}</select></label><label>الإجراء <select data-change="g-logf" data-k="act"><option value="">الكل</option>${acts.map((a) => `<option value="${esc(a)}" ${F.act === a ? 'selected' : ''}>${esc(GACT[a] || a)}</option>`).join('')}</select></label>${GX.archLoaded ? '' : '<button class="btn s" data-act="g-arch">تحميل القيود الأقدم</button>'}</div>

/* ====================================================================
   الدرجات من مصنف Excel بصيغة «توزيع الدرجات وكشوف الرصد» (نسخة المدرب)
   - يقرأ صيغتين: ملف رايات «درجات المقررات والشعب»، ومصنف المدرب الذي فيه
     «الشعبة» و«المكوّن» و«شعبة الرصد» وبنود تفصيلية لأعمال السنة.
   - البنود التفصيلية (الواجبات، المشاركة، الشهري 1، الشهري 2) تُقرأ من عناوين
     أعمدة كشف الشعبة «اسم البند (الحد)»، وكل بند يتبع أول عمود مكوّن بعده
     (LEC1 أو LAB1). مجموع حدود البنود يجب أن يساوي حد المكوّن المعتمد.
   - درجة المكوّن المرفوعة إلى رايات = مجموع بنوده (أو قيمة عمود المكوّن إن
     لم تكن له بنود). كل بند يُتحقق منه: رقم، غير سالب، لا يتجاوز حده، خانتان.
   ==================================================================== */
if (window.HAADER_WEB) (() => {
  const norm = (s) => String(s == null ? '' : s).replace(/[ً-ْـ]/g, '').replace(/\s+/g, ' ').trim();
  const cellOf = (v) => (v === null || v === undefined ? '' : String(v).trim());
  const hidx = (hdr, names) => { const h = hdr.map(norm); for (const n of names) { const i = h.indexOf(norm(n)); if (i >= 0) return i; } return -1; };
  const findHdr = (aoa, groups) => { for (let i = 0; i < Math.min(aoa.length, 40); i++) { const r = (aoa[i] || []); if (groups.every((g) => hidx(r, g) >= 0)) return i; } return -1; };
  const COMP_RE = /^([A-Za-z]{2,6}\d{1,2})(?:\s|\(|$)/;
  const ITEM_RE = /^(.+?)\s*\(\s*(\d+(?:\.\d+)?)\s*\)\s*$/;
  const NOT_ITEM = new Set(['النظري', 'العملي', 'المجموع', 'النسبة', 'الجزء النظري', 'الجزء العملي']);
  const isEmpty = (v) => v === null || v === undefined || cellOf(v) === '' || /^[—–-]+$/.test(cellOf(v));
  const r2 = (v) => Math.round(v * 100) / 100;

  /* أعمدة كشف الشعبة: المكوّنات والبنود التابعة لها */
  function sheetLayout(hdr, sec) {
    const comps = {}, items = [];
    hdr.forEach((h0, j) => {
      const h = norm(h0); if (!h) return;
      const m = COMP_RE.exec(h);
      if (m && G.compBy(sec, m[1].toUpperCase())) { comps[m[1].toUpperCase()] = j; return; }
      const it = ITEM_RE.exec(h);
      if (it && !NOT_ITEM.has(norm(it[1])) && !/^(مجموع|المجموع|الجزء|النظري|العملي|نظري|عملي|النسبة|التقدير|الحالة)/.test(norm(it[1])) && !COMP_RE.test(h)) items.push({ j, n: norm(it[1]), max: Number(it[2]) });
    });
    const compCols = Object.entries(comps).sort((a, b) => a[1] - b[1]);
    const byComp = {};
    items.forEach((it) => { const c = compCols.find(([, j]) => j > it.j); if (c) (byComp[c[0]] = byComp[c[0]] || []).push(it); });
    return { comps, byComp };
  }

  /* قراءة المصنف بصيغتيه */
  function parseBook(X, wb) {
    const out = { secs: {}, errs: [], meta: {} }, sheets = {};
    wb.SheetNames.forEach((n) => { sheets[n] = X.utils.sheet_to_json(wb.Sheets[n], { header: 1, raw: true, defval: null }); });

  };

  async function addCharts(buf, home, infos) {
    const zip = await window.JSZip.loadAsync(buf), H = q('الرئيسية'), T = home.T, R1 = home.R1, r0 = home.chartRow - 1;
    const st = infos.map((x) => { const s = G.stats(x.sec, gMarks(x.crn)); const req = x.el * x.inputs.length; return { avg: s.avg != null ? s.avg : null, pct: req ? Math.min(1, (x.filled || 0) / req) : 0 }; });
    const charts = [
      chartXml({ title: 'نسبة اكتمال إدخال الدرجات لكل شعبة', name: 'نسبة الاكتمال', color: '006C35', fmt: '0%', max: 1, ax: 501, cat: `${H}!$B$${T + 1}:$B$${R1}`, val: `${H}!$J$${T + 1}:$J$${R1}`, cats: infos.map((x) => x.crn), vals: st.map((x) => x.pct) }),
      chartXml({ title: 'متوسط مجموع الدرجات لكل شعبة', name: 'متوسط المجموع', color: '1F5AA6', fmt: '0.#', max: 100, ax: 601, cat: `${H}!$B$${T + 1}:$B$${R1}`, val: `${H}!$K$${T + 1}:$K$${R1}`, cats: infos.map((x) => x.crn), vals: st.map((x) => x.avg) }),
    ];
    charts.forEach((x, i) => zip.file(`xl/charts/chart${i + 1}.xml`, x));
    zip.file('xl/drawings/drawing1.xml', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<xdr:wsDr xmlns:xdr="http://schemas.openxmlformats.org/drawingml/2006/spreadsheetDrawing" xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main">${anchor(1, 0, r0, 5, r0 + 18)}${anchor(2, 5, r0, 11, r0 + 18)}</xdr:wsDr>`);
    zip.file('xl/drawings/_rels/drawing1.xml.rels', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/chart" Target="../charts/chart1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/chart" Target="../charts/chart2.xml"/></Relationships>`);
    const relP = 'xl/worksheets/_rels/sheet1.xml.rels', relX = zip.file(relP) ? await zip.file(relP).async('string') : '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"></Relationships>';
    zip.file(relP, relX.replace('</Relationships>', '<Relationship Id="rIdHChart" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/drawing" Target="../drawings/drawing1.xml"/></Relationships>'));
    let sx = await zip.file('xl/worksheets/sheet1.xml').async('string');
    if (!/xmlns:r=/.test(sx.slice(0, 600))) sx = sx.replace('<worksheet ', '<worksheet xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" ');
    const at = ['<legacyDrawing', '<legacyDrawingHF', '<picture', '<oleObjects', '<controls', '<webPublishItems', '<tableParts', '<extLst', '</worksheet>'].map((t) => sx.indexOf(t)).filter((i) => i >= 0).sort((a, b) => a - b)[0];
    sx = sx.slice(0, at) + '<drawing r:id="rIdHChart"/>' + sx.slice(at);
    zip.file('xl/worksheets/sheet1.xml', sx);
    let ct = await zip.file('[Content_Types].xml').async('string');
    ct = ct.replace('</Types>', '<Override PartName="/xl/drawings/drawing1.xml" ContentType="application/vnd.openxmlformats-officedocument.drawing+xml"/><Override PartName="/xl/charts/chart1.xml" ContentType="application/vnd.openxmlformats-officedocument.drawingml.chart+xml"/><Override PartName="/xl/charts/chart2.xml" ContentType="application/vnd.openxmlformats-officedocument.drawingml.chart+xml"/></Types>');
    zip.file('[Content_Types].xml', ct);
    return zip.generateAsync({ type: 'blob', mimeType: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet', compression: 'DEFLATE' });

  /* ---------- بناء المصنف ---------- */
  async function build(crns, opts) {
    await loadLibs();
    const secs = crns.map((c) => A.raw.gsec[c]).filter(Boolean).sort((a, b) => a.crn.localeCompare(b.crn));
    if (!secs.length) throw new HErrLocal('لا توجد شعب درجات لهذا الحساب.');
    const now = new Date(), term = secs[0].term || '', tkey = (secs[0].termCode || (term.match(/(1[34]\d{2})/) || [])[1] || 'T') + (/الأول/.test(term) ? '1' : /الثاني/.test(term) ? '2' : /الصيفي|الثالث/.test(term) ? '3' : '');
    const id = `HGB-${tkey}-${A.me.id.slice(-6)}-${now.getTime().toString(36).toUpperCase()}`;
    const ctx = { id, term, trainerName: A.me.name || '', withGrades: opts.withGrades !== false, atText: now.toLocaleString('ar-SA-u-nu-latn', { timeZone: 'Asia/Riyadh', dateStyle: 'medium', timeStyle: 'short' }) };
    const wb = new window.ExcelJS.Workbook();
    wb.creator = 'منصة حاضر'; wb.company = 'الكلية التقنية ببيشة'; wb.title = 'نموذج إدخال الدرجات'; wb.created = now;
    wb.calcProperties.fullCalcOnLoad = true;
    wb.views = [{ x: 0, y: 0, width: 20000, height: 12000, firstSheet: 0, activeTab: 0, visibility: 'visible' }];
    wb.addWorksheet('الرئيسية', { properties: { tabColor: { argb: GREEN } } });
    addInstructions(wb);
    const infos = secs.map((s) => { const x = addSection(wb, s, ctx); const m = gMarks(s.crn), sub = ((A.raw.gmarks[s.crn] || {}).s) || {}; x.filled = ctx.withGrades ? (s.rows || []).filter((r) => r.el).reduce((a, r) => a + G.comps(s).reduce((b, c) => b + ((s.items || {})[c.k] ? Object.values((sub[r.id] || {})[c.k] || {}).filter(G.isNum).length : (G.isNum(G.val(m, r.id, c.k)) ? 1 : 0)), 0), 0) : 0; return x; });
    const home = addHome(wb, ctx, infos);
    addDist(wb, secs); addSettings(wb);
    const meta = { app: 'haader-grades', v: 1, id, term, termCode: secs[0].termCode || '', trainer: A.me.id, trainerName: A.me.name || '', at: now.toISOString(), crns: secs.map((s) => s.crn), sigs: Object.fromEntries(secs.map((s) => [s.crn, secSig(s)])), withGrades: ctx.withGrades };
    const mws = wb.addWorksheet('_haader', { state: 'veryHidden' });
    mws.getCell('A1').value = 'haader-grades'; mws.getCell('A2').value = JSON.stringify(meta);
    mws.protect('', {});
    const buf = await wb.xlsx.writeBuffer();
    const blob = await addCharts(buf, home, infos);
    return { blob, meta };
  }
  function HErrLocal(m) { this.message = m; }
  async function download(crns, opts) {
    toast('جارٍ إنشاء المصنف…');
    let r; try { r = await build(crns, opts || {}); } catch (e) { toast(e && e.message && /[؀-ۿ]/.test(e.message) ? e.message : 'تعذر إنشاء المصنف. أعد المحاولة.'); console.error(e); return null; }
    const name = (opts && opts.name) || `نموذج إدخال الدرجات - ${r.meta.crns.length === 1 ? 'الشعبة ' + r.meta.crns[0] : r.meta.crns.length + ' شعب'} - ${r.meta.id}.xlsx`;
    await save(name, r.blob);
    gLog([['tpl', r.meta.crns.join('،'), '', '', '', '', `تنزيل نموذج إدخال الدرجات ${r.meta.id} (${r.meta.crns.length} شعبة${r.meta.withGrades ? '، بالدرجات المحفوظة' : ''})`]]);
    return r.meta;
  }
  const mine = () => gSecs().map((s) => s.crn).filter((c) => gMay(c));
  window.HAADER_GX = { build, download, secSig, mine, SCALE };
})();

boot();

</script>
