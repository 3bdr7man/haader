<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>منصة حاضر</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:Cairo,Tahoma,sans-serif;background:#F2F5F9;color:#12233A;display:grid;place-items:center;min-height:100vh;margin:0}.c{background:#fff;border:1px solid #D5DEE9;border-radius:16px;padding:28px 32px;max-width:520px;text-align:center;box-shadow:0 8px 28px rgba(0,0,0,.06)}h1{margin:0 0 6px;font-size:22px;color:#003366}p{color:#4A5D75;line-height:1.9;margin:8px 0 0;font-size:14.5px}</style></head><body><div class="c"><h1>منصة حاضر</h1><p>المؤسسة العامة للتدريب التقني والمهني — الكلية التقنية ببيشة<br>قسم الحاسب وتقنية المعلومات</p><p>هذا العنوان محجوز للمنصة، وهي قيد التجهيز للتشغيل المشترك.<br>لا تُرسل هذا الرابط لأحد قبل اكتمال التهيئة.</p></div></body></html>
